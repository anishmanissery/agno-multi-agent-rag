<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agno Chat Interface</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 950px;
        margin: 20px auto;
        padding: 10px;
      }
      #chat-box {
        border: 1px solid #ccc;
        height: 300px;
        overflow-y: scroll;
        padding: 10px;
        margin-bottom: 10px;
      }
      .user-msg {
        color: blue;
        text-align: right;
      }
      .bot-msg {
        color: green;
        text-align: left;
        line-height: 1.5;
      }
      #input-area {
        display: flex;
        gap: 10px;
      }
      input {
        flex-grow: 1;
        padding: 8px;
      }
      #loading_container {
        text-align: center;
        display: none;
      }
      #loading-indicator {
        width: 300px;
        margin-top: -40px;
        margin-bottom: -80px;
      }
      #tip {
        margin-top: 20px;
        line-height: 1.5;
        color: gray;
        text-align: left;
      }
    </style>
    <script type="module" src="https://md-block.verou.me/md-block.js"></script>
  </head>
  <body>
    <h2>Chat with Agno Agent</h2>
    <div id="chat-box"></div>
    <form id="input-area" onsubmit="sendMessage()">
      <input type="text" id="user-input" placeholder="Type your question..." />
      <button type="submit" id="submit-btn">Send</button>
    </form>
    <div id="loading_container">
      <img src="static/loading.svg" alt="Loading..." id="loading-indicator" />
    </div>
    <div id="tip">
      Ask questions about the Agno framework (e.g., 'What is Agno?'), Thai
      cuisine (e.g., 'How do I make Tom Kha Gai?'), or general topics.
    </div>

    <script>
      function setLoadingState(isLoading) {
        document.getElementById("user-input").disabled = isLoading;
        document.getElementById("submit-btn").disabled = isLoading;
        document.getElementById("loading_container").style.display = isLoading
          ? "block"
          : "none";
      }

      async function sendMessage() {
        event.preventDefault(); // Prevent form submission
        setLoadingState(true);

        const input = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const query = input.value.trim();

        if (!query) return;

        // Display user message
        chatBox.innerHTML += `<p class="user-msg"><b>You:</b> ${query}</p>`;
        input.value = "";

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: query }),
          });

          const data = await response.json();

          chatBox.innerHTML += `<p class="bot-msg"><b>Agent:</b> <md-block>${data.response.content}</md-block></p>`;
          chatBox.scrollTop = chatBox.scrollHeight;

          setLoadingState(false);
        } catch (error) {
          console.error("Error:", error);
          chatBox.innerHTML += `<p style="color:red">Error connecting to server.</p>`;
          setLoadingState(false);
        }
      }
    </script>
  </body>
</html>
